name: Build Windows VST3
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Vocal2Instrument_clean/Vocal2Instrument
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Core tests
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: Vocal2Instrument-win64
          path: |
            Vocal2Instrument_clean/Vocal2Instrument/build/plugin/Vocal2Instrument_artefacts/Release/VST3
            Vocal2Instrument_clean/Vocal2Instrument/build/plugin/Vocal2Instrument_artefacts/Release/Standalone
